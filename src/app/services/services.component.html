<section class="hero">
  <div class="section-header hero-content">
    <h1>Services</h1>
    <p>How I help teams modernize, build and secure critical software</p>
  </div>
</section>

<section class="services-container">
  <div class="services-grid">
    <div class="service-card" *ngFor="let service of services">
      <a [routerLink]="['/services', service.slug]" class="service-link">
        <div class="service-icon">
          <mat-icon>{{service.icon}}</mat-icon>
        </div>
        <h3>{{service.title}}</h3>
        <p>{{service.description}}</p>
        <span class="learn-more">Learn more →</span>
      </a>
    </div>
  </div>

  <div class="cta-section">
    <h2>Have a system that needs modernizing?</h2>
    <p>Tell me about the system and the team, and let's see if I can help.</p>
    <a routerLink="/contact" class="cta-button">Get in touch</a>
  </div>
</section>
